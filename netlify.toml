# The build is fully static and uses hash routing, so no redirect rules are
# needed — every route lives behind the # and index.html serves all of them.
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Hashed asset filenames are immutable, so they can be cached indefinitely.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# index.html must not be cached, or a deploy is invisible until the cache expires.
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
