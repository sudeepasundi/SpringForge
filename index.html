<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SpringForge — learn Spring Boot and microservices from first principles to production, with diagrams, annotated demo projects, and quizzes." />
    <meta name="theme-color" content="#0b0f14" />
    <title>SpringForge — Spring Boot &amp; Microservices, Zero to Production</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%236DB33F'/%3E%3Cpath d='M9 22c6 2 11-1 12-6 .6-3-1-6-3-8 .4 2 .2 3.6-.8 5-.7-3-2.6-5-5.2-6 .8 2.2.4 4-1.2 6.2C9.4 15 8.4 17 9 22z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      // Applied before first paint so the theme never flashes.
      try {
        var stored = JSON.parse(localStorage.getItem('springforge:v1') || '{}');
        var theme = (stored.state && stored.state.theme) || 'system';
        var dark = theme === 'dark' || (theme === 'system' && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
